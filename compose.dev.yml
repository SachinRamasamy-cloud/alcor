name: alcor-development
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: alcor_migrate
      POSTGRES_PASSWORD: alcor_local_migration
      POSTGRES_DB: alcor
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["alcor_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alcor_migrate -d alcor"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["alcor_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  alcor_pg:
  alcor_redis:
